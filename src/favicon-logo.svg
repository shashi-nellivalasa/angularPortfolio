<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Vibrant Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Accent Frame -->
  <polygon points="250,55 415,150 415,350 250,445 85,350 85,150" fill="none" stroke="url(#strokeGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.55" />

  <!-- Monogram Logo Mark (SN Interlock) -->
  <g filter="url(#neonGlow)">
    <!-- Letter 'S' Ribbon -->
    <path d="M 230 155
             L 165 155
             A 15 15 0 0 0 150 170
             L 150 215
             A 15 15 0 0 0 165 230
             L 225 245
             A 15 15 0 0 1 240 260
             L 240 325
             A 15 15 0 0 1 225 340
             L 150 340" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter 'N' Ribbon -->
    <path d="M 275 340
             L 275 160
             L 345 335
             L 345 155" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Accent Nodes -->
    <circle cx="345" cy="155" r="7" fill="#00F0FF" />
    <circle cx="150" cy="340" r="7" fill="#FF007A" />
  </g>
</svg>