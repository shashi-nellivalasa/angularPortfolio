<!-- ==========================================================================
     SECTION 03: PRINCIPLES
     ========================================================================== -->
<section id="skills" class="skills-section">
  <!-- Sticky Eyebrow Header -->
  <div class="sticky-eyebrow">
    <p class="hud-label text-muted">
      <span class="text-faint">04</span>
      <span style="margin: 0 0.5rem;" class="text-faint">/</span>
      SKILLS
    </p>
    <p class="hud-label text-faint" style="display: none; @media(min-width: 640px) { display: block; }">
      Core Competencies · Architecture · Language Runtimes
    </p>
  </div>

  <!-- Skills Principles Grid -->
  <div class="skills-grid">
    <div *ngFor="let skill of skills" class="skill-card">
      <div class="skill-card-header">
        <div class="skill-icon-box">
          <i [class]="skill.icon" style="font-size: 1.15rem;"></i>
        </div>
        <span class="hud-label text-faint">{{ skill.id }}</span>
      </div>

      <div class="skill-card-main">
        <span class="skill-category-tag">{{ skill.category }}</span>
        <h3 class="skill-title">{{ skill.displayName }}</h3>
        <p class="skill-desc">{{ skill.description }}</p>
      </div>

      <!-- Precision HUD Gauge -->
      <div class="skill-gauge">
        <div class="gauge-header">
          <span class="gauge-label">PROFICIENCY RATING</span>
          <span class="gauge-val">{{ skill.percentage }}%</span>
        </div>
        <div class="gauge-track">
          <div class="gauge-fill" [style.width.%]="skill.percentage"></div>
        </div>
      </div>
    </div>
  </div>
</section>
