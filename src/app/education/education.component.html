<!-- ==========================================================================
     SECTION 03: EDUCATION
     ========================================================================== -->
<section id="education" class="education-section">
  <!-- Sticky Eyebrow Header -->
  <div class="sticky-eyebrow">
    <p class="hud-label text-muted">
      <span class="text-faint">03</span>
      <span style="margin: 0 0.5rem;" class="text-faint">/</span>
      EDUCATION
    </p>
    <p class="hud-label text-faint" style="display: none; @media(min-width: 640px) { display: block; }">
      Professional Experience & Academic Engineering Timeline
    </p>
  </div>

  <!-- Editorial Timeline Grid -->
  <div class="timeline-grid">
    <div *ngFor="let item of events" class="timeline-card">
      <div class="card-step-row">
        <span class="hud-label text-faint">{{ item.step }}</span>
        <span class="duration-tag">{{ item.duration }}</span>
      </div>

      <div class="card-main-info">
        <span class="institute-label">{{ item.institute }}</span>
        <h3 class="degree-title">{{ item.degree }}</h3>
        <p class="description-text">{{ item.description }}</p>
      </div>

      <div class="card-footer-score">
        <span class="hud-tag active">{{ item.score }}</span>
        <span class="hud-label text-faint">VERIFIED RECORD</span>
      </div>
    </div>
  </div>
</section>
